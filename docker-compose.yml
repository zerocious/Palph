# Palph Telegram bot — single-service compose.
# Note: container_name + DB_PATH retain legacy "studybuddy" prefixes for
# backward compatibility with running production deployments (renaming
# would force docker-compose down + DB rename). See README "Имя проекта".
# Запуск:   docker compose up -d --build
# Логи:     docker compose logs -f bot
# Статус:   docker compose ps
# Стоп:     docker compose down
#
# Persistent state (БД, логи, мигрированный admins.json) живёт в ./data
# на хосте — переживает rebuild контейнера.

services:
  bot:
    build: .
    container_name: studybuddy-bot
    restart: unless-stopped

    # BOT_TOKEN + MAIN_ADMIN_ID + опционально SERVER_TIMEZONE / LOG_LEVEL
    # читаются из .env на хосте.
    env_file: .env

    # Переопределяем пути в контейнере, чтобы persistent state шёл в volume,
    # а не в эфемерный слой образа. Backup'ы тоже в /app/data — переживают rebuild.
    environment:
      DB_PATH: /app/data/studybuddy.db
      LOG_FILE: /app/data/bot.log
      BACKUP_DIR: /app/data/backups
      BACKUP_RETENTION_DAYS: "30"

    volumes:
      - ./data:/app/data

    # HTTP API для desktop-приложения (api.py). Порт публикуется только
    # когда в .env стоит API_ENABLED=1 — иначе внутри контейнера никто
    # не слушает и маппинг просто ничего не отдаёт. Наружу — через
    # reverse-proxy с TLS: WebView Tauri ходит по https.
    ports:
      - "127.0.0.1:8080:8080"

    # Лог-драйвер Docker'а ловит stdout — `docker compose logs` работает.
    # Файл-логи всё равно остаются в /app/data для post-mortem.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
