name: Security audit

# Сканируем зависимости на known CVEs через pip-audit:
#   - раз в неделю автоматически (понедельник 07:00 UTC)
#   - вручную через workflow_dispatch
#   - на каждом PR, который меняет requirements.txt (защита от
#     случайного добавления уязвимой зависимости)
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'requirements-dev.txt'

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit production deps
        run: pip-audit --requirement requirements.txt --strict
        # --strict: non-zero exit на любой vulnerability (fails CI).

      - name: Audit dev deps
        if: always()
        run: pip-audit --requirement requirements-dev.txt --strict
