name: Desktop app build

# Собирает Windows-установщик приложения из desktop/ и кладёт его в
# артефакты запуска — скачать можно со страницы самого запуска, ничего
# устанавливать локально не нужно.
#
# Заодно это единственная проверка того, что Rust-часть компилируется под
# Windows: в Linux-окружении собирается всё, кроме WebView2-бэкенда и
# упаковки в MSI/NSIS.
#
# Используются только официальные actions/* — сторонние в цепочку сборки
# не тянем.

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:  # кнопка «Run workflow» — собрать в любой момент

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Rust на windows-latest предустановлен — отдельный action не нужен.
      - name: Rust toolchain
        run: rustup show

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      # tauri build сам вызывает beforeBuildCommand (tsc --noEmit + vite
      # build), поэтому ошибки типов обнаружатся до сборки Rust.
      - name: Build installer
        working-directory: desktop
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: palph-windows-installer
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
