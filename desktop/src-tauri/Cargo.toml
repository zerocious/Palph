[package]
name = "palph-desktop"
version = "0.1.0"
description = "Palph — учебный компаньон для Windows"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Имя с суффиксом _lib, чтобы не конфликтовать с бинарём на Windows.
name = "palph_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
